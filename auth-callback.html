<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061021">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="favicon.png" type="image/png">
  <title>SeaVie — Confirming your account</title>
  <style>
    :root {
      --navy: #061021;
      --panel: #0e1c38;
      --line: rgba(226,232,240,.12);
      --ink: #e7ecf5;
      --muted: rgba(231,236,245,.62);
      --faint: rgba(231,236,245,.42);
      --signal: #38bdf8;
      --tide: #34d399;
      --danger: #fb7185;
      --body: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: var(--body);
      color: var(--ink);
      background:
        radial-gradient(700px 420px at 85% 0%, rgba(56,189,248,.13), transparent 60%),
        radial-gradient(600px 420px at 0% 100%, rgba(52,211,153,.07), transparent 60%),
        var(--navy);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(430px, 100%);
      padding: 34px 30px 30px;
      text-align: center;
      background: rgba(14,28,56,.92);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(18px);
    }

    .mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(56,189,248,.35);
      border-radius: 16px;
      color: var(--signal);
      background: rgba(56,189,248,.08);
    }

    .mark svg { width: 27px; height: 27px; }

    .eyebrow {
      margin-bottom: 9px;
      font: 10px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--signal);
    }

    h1 {
      margin: 0 0 10px;
      font: 600 29px/1.15 var(--display);
      letter-spacing: -.01em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin: 22px 0 20px;
      padding: 9px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--signal);
      box-shadow: 0 0 0 4px rgba(56,189,248,.10);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .success .dot { background: var(--tide); box-shadow: 0 0 0 4px rgba(52,211,153,.10); animation: none; }
    .error .dot { background: var(--danger); box-shadow: 0 0 0 4px rgba(251,113,133,.10); animation: none; }

    .btn {
      display: none;
      width: 100%;
      margin-top: 20px;
      padding: 13px 18px;
      border-radius: 12px;
      border: 1px solid rgba(56,189,248,.35);
      background: linear-gradient(135deg, #0ea5e9, #38bdf8);
      color: #03101f;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .footer {
      margin-top: 24px;
      color: var(--faint);
      font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .04em;
    }

    @keyframes pulse {
      50% { opacity: .35; transform: scale(.82); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dot { animation: none; }
    }
  </style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3.5 7.5h17M5.5 4.5h13a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2v-11a2 2 0 0 1 2-2Z"/>
        <path d="m7.5 13 2.3 2.3 6.7-6.6"/>
      </svg>
    </div>

    <div class="eyebrow">SeaVie · Account</div>
    <h1 id="title">Confirming your account</h1>
    <p id="message">Your account has been confirmed. We’re opening SeaVie now.</p>

    <div class="status" id="status">
      <span class="dot"></span>
      <span id="statusText">Opening the app…</span>
    </div>

    <a class="btn" id="app-link" href="seavieexpo://login">Open SeaVie</a>

    <div class="footer">You can close this page after SeaVie opens.</div>
  </main>

  <script>
    (function () {
      const APP_SCHEME = "seavieexpo://login";
      const card = document.getElementById("card");
      const title = document.getElementById("title");
      const message = document.getElementById("message");
      const statusText = document.getElementById("statusText");
      const status = document.getElementById("status");
      const button = document.getElementById("app-link");

      const params = new URLSearchParams(window.location.search);
      const hash = window.location.hash || "";

      // Supabase may return auth errors in the query string or fragment.
      const error = params.get("error") || new URLSearchParams(hash.replace(/^#/, "")).get("error");
      const errorDescription =
        params.get("error_description") ||
        new URLSearchParams(hash.replace(/^#/, "")).get("error_description");

      if (error) {
        card.classList.add("error");
        title.textContent = "Confirmation could not be completed";
        message.textContent = errorDescription
          ? decodeURIComponent(errorDescription.replace(/\+/g, " "))
          : "The confirmation link is invalid or has expired. Please request a new link.";
        statusText.textContent = "Action required";
        return;
      }

      // Preserve the Supabase callback payload exactly. Hash fragments are not
      // sent to the web server, but are available here for the hand-off to the app.
      const target = APP_SCHEME + (window.location.search || "") + hash;
      button.href = target;

      let opened = false;
      const openApp = () => {
        if (opened) return;
        opened = true;
        statusText.textContent = "Opening SeaVie…";
        window.location.href = target;
      };

      // Give the browser a moment to render the confirmation state before
      // attempting the custom-scheme hand-off.
      window.setTimeout(openApp, 650);

      // If the OS/browser blocks the custom scheme, leave a visible fallback.
      window.setTimeout(() => {
        card.classList.add("success");
        button.style.display = "inline-block";
        statusText.textContent = "Ready to continue";
      }, 1800);
    })();
  </script>
</body>
</html>
